[project]
name = "junction-violation-detection"
version = "0.1.0"
description = "Hệ thống phát hiện phương tiện đè vạch mắt võng (Yellow Box Junction Violation Detection) tại Việt Nam"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DUT NCKH Research Team" },
]
keywords = ["traffic-violation", "yolo", "computer-vision", "vietnam", "yellow-box-junction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── AI / Deep Learning Backend ──────────────────────────────────────
    "torch>=2.7.0",                # PyTorch 2.7+ required for RTX 50 series (Blackwell sm_120)
    "torchvision>=0.20.0",         # Explicitly require torchvision to force cu128 resolution
    "ultralytics",                 # YOLO26 end-to-end object detection API
    # ── OCR Pipeline ────────────────────────────────────────────────────
    "paddleocr>=2.7.0,<3.0.0",     # Keep v2 API/runtime compatibility with current Paddle backend
    "paddlepaddle>=2.6.0,<3.0.0",  # CPU-only backend for PaddleOCR
    # ── Inference Optimization ──────────────────────────────────────────
    "tensorrt>=8.6.1",             # NVIDIA TensorRT model compilation & inference
    "onnx>=1.12.0,<2.0.0",         # ONNX export path for TensorRT->ONNX fallback
    "onnxruntime>=1.16.0,<1.24.0", # ONNX Runtime backend used on CPU fallback (py310-compatible)
    "lap>=0.5.12",                 # ByteTrack association dependency for ultralytics tracking
    "protobuf>=3.20.2,<5.0.0",     # Compatible protobuf range
    # ── Computer Vision & Math ──────────────────────────────────────────
    "opencv-contrib-python==4.10.0.84",  # GUI-enabled OpenCV build for cv2.imshow on Windows
    "numpy>=1.24.0,<2.0.0",        # Stay on Numpy 1.x for PaddlePaddle compatibility
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[project.scripts]
jvd = "jvd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jvd"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.uv]
# Replace headless/plain opencv with our GUI-enabled contrib build
override-dependencies = [
    "opencv-python-headless>=4.10.0.84 ; python_version < '0'",
    "opencv-python>=4.10.0.84 ; python_version < '0'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
