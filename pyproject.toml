[project]
name = "junction-violation-detection"
version = "0.1.0"
description = "Hệ thống phát hiện phương tiện đè vạch mắt võng (Yellow Box Junction Violation Detection) tại Việt Nam"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DUT NCKH Research Team" },
]
keywords = ["traffic-violation", "yolo", "computer-vision", "vietnam", "yellow-box-junction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── AI / Deep Learning Backend ──────────────────────────────────────
    "torch>=2.0.0",                # Tensor processing & CUDA backend for YOLO26
    "ultralytics",                 # YOLO26 end-to-end object detection API
    # ── OCR Pipeline ────────────────────────────────────────────────────
    "paddleocr>=2.6.0",            # Multi-language OCR for license plate extraction
    "paddlepaddle-gpu>=2.5.0",     # GPU-accelerated backend for PaddleOCR
    # ── Inference Optimization ──────────────────────────────────────────
    "tensorrt>=8.6.1",             # NVIDIA TensorRT model compilation & inference
    # ── Computer Vision & Math ──────────────────────────────────────────
    "opencv-python>=4.8.0",        # Video I/O, OSD rendering, optical flow
    "numpy>=1.24.0",               # Matrix operations, polygon geometry, trajectory
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[project.scripts]
jvd = "jvd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jvd"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
